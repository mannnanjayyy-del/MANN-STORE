<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MANN STORE</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(-45deg, #000000, #1a1a1a, #121212, #0a0a0a);
      background-size: 400% 400%;
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      animation: gradientMove 10s ease infinite;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
      animation: fadeIn 1.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    img.logo {
      width: 200px;
      margin-top: 30px;
      animation: fadeInLogo 1.5s ease-in-out;
    }

    @keyframes fadeInLogo {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    h1 {
      font-size: 32px;
      margin-top: 15px;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255,255,255,0.3);
    }

    p {
      font-size: 16px;
      color: #ccc;
    }

    .button {
      display: block;
      margin: 15px auto;
      padding: 12px 20px;
      width: 80%;
      background-color: #25D366;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(37, 211, 102, 0.4);
    }

    .button:hover {
      background-color: #128C7E;
      box-shadow: 0 0 25px rgba(37, 211, 102, 0.9);
      transform: scale(1.05);
    }

    .instagram {
      background-color: #E1306C;
      box-shadow: 0 0 15px rgba(225, 48, 108, 0.4);
    }

    .instagram:hover {
      background-color: #C13584;
      box-shadow: 0 0 25px rgba(225, 48, 108, 0.9);
    }

    .owner {
      margin-top: 35px;
      animation: fadeInUp 1.5s ease-in-out;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .owner img {
      width: 230px;
      border-radius: 15px;
      margin-top: 10px;
      box-shadow: 0 0 15px rgba(255,255,255,0.25);
      transition: transform 0.3s ease;
    }

    .owner img:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(255,255,255,0.4);
    }

    /* Tombol musik */
    #musicControl {
      margin-top: 25px;
      background-color: #444;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    #musicControl:hover {
      background-color: #25D366;
      box-shadow: 0 0 15px rgba(37, 211, 102, 0.7);
      transform: scale(1.05);
    }

    footer {
      margin-top: 25px;
      font-size: 12px;
      color: #777;
      padding-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Logo -->
    <img src="LOGO. jpg" alt="Logo MANN STORE" class="logo" />

    <h1>MANN STORE</h1>
    <div class="layanan">
  <a href="#" class="btn-layanan">Pulsa</a>
  <a href="#" class="btn-layanan">Topup Game</a>
  <a href="#" class="btn-layanan">Suntik Sosmed</a>
  <a href="#" class="btn-layanan">Jasa Edit</a>
  <a href="#" class="btn-layanan">Aplikasi Pro</a>
    </div>

    <!-- Tombol WhatsApp -->
    <a href="https://wa.me/6281357525602" class="button">Hubungi via WhatsApp</a>

    <!-- Tombol Instagram -->
    <a href="https://www.instagram.com/mannnn_storexzz22?igsh=MWxqcTRhNTNobmU2eA==" class="button instagram">Kunjungi Instagram</a>

    <!-- Foto Owner -->
    <div class="owner">
      <h3>Owner:</h3>
      <img src="PP.jpg" alt="Owner MANN STORE" />
    </div>

    <!-- Musik -->
    <button id="musicControl">🔊 Matikan Musik</button>
    <audio id="bgMusic" autoplay loop>
      <source src="Pufino - Hopeful (freetouse.com).mp3" type="audio/mpeg">
      Browser kamu tidak mendukung pemutar musik.
    </audio>

    <footer>© 2025 MANN STORE. All Rights Reserved.</footer>
  </div>

  <script>
    const music = document.getElementById("bgMusic");
    const btn = document.getElementById("musicControl");

    btn.addEventListener("click", () => {
      if (music.paused) {
        music.play();
        btn.textContent = "🔊 Matikan Musik";
      } else {
        music.pause();
        btn.textContent = "🔇 Nyalakan Musik";
      }
    });
  </script>
</body>
</html>
